name: Change Control Monitor

on:
  schedule:
    - cron: "15 7 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute control
        id: control
        continue-on-error: true
        run: python -m src.main --fail-on-findings
      - name: Upload complete run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-control-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 90
      - name: Classify result
        if: always()
        id: result
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("output/control_evidence.json"))
          print(f"input_valid={'true' if data['input_valid'] else 'false'}")
          print(f"findings={len(data['findings'])}")
          print(f"has_findings={'true' if data['findings'] else 'false'}")
          PY
      - name: Maintain one exception issue per finding
        if: always() && steps.result.outputs.input_valid == 'true' && steps.result.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const evidence = JSON.parse(fs.readFileSync('output/control_evidence.json', 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'change-control-exception';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (_) {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: 'Automated production change-management exception'
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: label, per_page: 100
            });
            for (const finding of evidence.findings) {
              const marker = `<!-- finding-id:${finding.finding_id} -->`;
              const body = [
                marker,
                `# Change-management exception ${finding.finding_id}`,
                '',
                `- **Run ID:** \`${evidence.run_id}\``,
                `- **Control:** \`${finding.control_id}\``,
                `- **Rule:** \`${finding.rule}\``,
                `- **Severity:** ${finding.severity}`,
                `- **Platform:** ${finding.platform}`,
                `- **Object:** ${finding.object_type} \`${finding.object_id}\``,
                '- **Status:** Open — human decision required',
                '', '## Detection detail', '', finding.detail,
                '', '## Required human response', '',
                `- [ ] Approved remediation decision: ${finding.remediation}`,
                `- [ ] Lookback: ${finding.lookback}`,
                `- [ ] Root cause: ${finding.root_cause}`,
                `- [ ] Closure evidence: ${finding.closure_evidence}`,
                '- [ ] Control owner approved closure',
                '',
                'Automation must not mutate production, approve its own recommendation, or close this case.'
              ].join('\n');
              const existing = issues.find(issue => (issue.body || '').includes(marker));
              if (!existing) {
                await github.rest.issues.create({
                  owner, repo,
                  title: `[Change Control] ${finding.rule} — ${finding.platform} — ${finding.object_id}`,
                  body, labels: [label]
                });
              } else if (existing.state === 'closed') {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'open', body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Finding recurred in workflow run ${context.runId}; case reopened for human review.`
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Finding remains present in workflow run ${context.runId}. Current evidence is retained with the run.`
                });
              }
            }
      - name: Fail on invalid evidence or findings
        if: always() && (steps.result.outputs.input_valid != 'true' || steps.result.outputs.has_findings == 'true')
        run: |
          echo "Control requires attention. Review retained evidence and individual cases."
          exit 1
